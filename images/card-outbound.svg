<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 578" width="1200" height="578">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1A10"/>
      <stop offset="100%" stop-color="#162B1C"/>
    </linearGradient>
    <linearGradient id="phoneShell" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#323234"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </linearGradient>
    <linearGradient id="navBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#007A3D"/>
      <stop offset="100%" stop-color="#005C2E"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00A84F"/>
      <stop offset="100%" stop-color="#007A3D"/>
    </linearGradient>
    <linearGradient id="glowFade" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00C853" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00C853" stop-opacity="0"/>
    </linearGradient>
    <!-- Screen clip: phone at x=716 y=-50, w=268, screen inset 14px sides, 44px top, 30px bottom -->
    <clipPath id="sc">
      <rect x="730" y="-6" width="240" height="614" rx="28"/>
    </clipPath>
    <filter id="shadow" x="-40%" y="-10%" width="180%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="lineGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="578" fill="url(#bg)"/>

  <!-- Dot grid -->
  <pattern id="grid" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
    <circle cx="18" cy="18" r="0.9" fill="#00C853" fill-opacity="0.08"/>
  </pattern>
  <rect width="1200" height="578" fill="url(#grid)"/>

  <!-- Left ambient glow -->
  <ellipse cx="120" cy="289" rx="300" ry="280" fill="url(#glowFade)"/>
  <!-- Right ambient -->
  <ellipse cx="1100" cy="500" rx="180" ry="140" fill="#00C853" fill-opacity="0.04"/>

  <!-- Left text -->
  <text x="80" y="215" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700"
        letter-spacing="3.5" fill="#00C853" fill-opacity="0.8">OUTBOUND APP</text>
  <text x="80" y="268" font-family="Inter,system-ui,sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">Scan to</text>
  <text x="80" y="322" font-family="Inter,system-ui,sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">Collect</text>
  <rect x="80" y="338" width="48" height="3" rx="1.5" fill="#00C853"/>
  <text x="80" y="374" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#FFFFFF" fill-opacity="0.38">Mobile · iOS</text>

  <!-- ─── Phone shell ─── -->
  <!-- Width: 268, Height: 678  →  AR = 268/678 = 0.395... let me check: real phone is ~0.46
       Actually at render: 268*(500/1200)=112px wide, 578*(240/578)=240px card height, bleed makes it fill height
       Phone bleed: y=-50 top, y=-50+678=628 bottom → crops 50px top & 50px bottom → visible 578px fills card ✓ -->
  <rect x="716" y="-50" width="268" height="678" rx="44"
        fill="url(#phoneShell)" filter="url(#shadow)"/>
  <!-- Edge highlight -->
  <rect x="716" y="-50" width="268" height="678" rx="44"
        fill="none" stroke="#404042" stroke-width="1.5"/>

  <!-- Screen glass -->
  <rect x="730" y="-6" width="240" height="614" rx="28" fill="#F2F2F7"/>

  <!-- ─── App UI ─── -->
  <g clip-path="url(#sc)">

    <!-- Status bar -->
    <rect x="730" y="-6" width="240" height="40" fill="#005C2E"/>
    <text x="748" y="20" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600"
          fill="white" fill-opacity="0.9">9:41</text>
    <!-- Battery -->
    <rect x="940" y="10" width="18" height="9" rx="2" fill="none" stroke="white" stroke-opacity="0.65" stroke-width="1.1"/>
    <rect x="958" y="12.5" width="2" height="4" rx="1" fill="white" fill-opacity="0.65"/>
    <rect x="942" y="12" width="13" height="5" rx="1" fill="white" fill-opacity="0.8"/>
    <!-- Signal -->
    <circle cx="924" cy="14" r="1.6" fill="white" fill-opacity="0.8"/>
    <circle cx="917" cy="14" r="1.6" fill="white" fill-opacity="0.5"/>
    <circle cx="910" cy="14" r="1.6" fill="white" fill-opacity="0.3"/>

    <!-- Nav bar -->
    <rect x="730" y="34" width="240" height="50" fill="url(#navBar)"/>
    <!-- Back chevron -->
    <polyline points="745,59 739,59" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <polyline points="739,59 744,53.5 744,64.5 739,59" fill="white"/>
    <text x="850" y="64" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600"
          fill="white" text-anchor="middle">Scan to Collect</text>
    <!-- Stop badge -->
    <rect x="934" y="50" width="48" height="18" rx="9" fill="white" fill-opacity="0.2"/>
    <text x="958" y="63" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600"
          fill="white" text-anchor="middle">3 of 12</text>

    <!-- Content bg -->
    <rect x="730" y="84" width="240" height="524" fill="#F2F2F7"/>

    <!-- Stop card -->
    <rect x="742" y="94" width="216" height="58" rx="10" fill="white"/>
    <rect x="742" y="94" width="3.5" height="58" rx="2" fill="#006B36"/>
    <circle cx="765" cy="123" r="14" fill="#E8F5ED"/>
    <rect x="758" y="116" width="14" height="14" rx="2" fill="#006B36" fill-opacity="0.65"/>
    <line x1="758" y1="121" x2="772" y2="121" stroke="white" stroke-width="1"/>
    <line x1="765" y1="116" x2="765" y2="130" stroke="white" stroke-width="1"/>
    <text x="786" y="118" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600"
          fill="#1C1C1E">Stop 3 — Hub Pickup</text>
    <text x="786" y="136" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8E8E93">4 parcels · 2 bags</text>
    <polyline points="944,119 949,124 944,129" stroke="#C7C7CC" stroke-width="1.4"
              stroke-linecap="round" fill="none"/>

    <!-- Scan label -->
    <text x="850" y="174" font-family="Inter,system-ui,sans-serif" font-size="9.5" font-weight="600"
          letter-spacing="1.2" fill="#8E8E93" text-anchor="middle">POINT CAMERA AT LABEL</text>

    <!-- Scan zone -->
    <rect x="750" y="182" width="200" height="160" rx="4" fill="white"/>

    <!-- Corner TL -->
    <path d="M756,188 L756,204 M756,188 L772,188" stroke="#006B36" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- Corner TR -->
    <path d="M944,188 L944,204 M944,188 L928,188" stroke="#006B36" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- Corner BL -->
    <path d="M756,342 L756,326 M756,342 L772,342" stroke="#006B36" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- Corner BR -->
    <path d="M944,342 L944,326 M944,342 L928,342" stroke="#006B36" stroke-width="2.4" stroke-linecap="round" fill="none"/>

    <!-- Scan line -->
    <rect x="756" y="261" width="188" height="2" rx="1" fill="#00C853" fill-opacity="0.8"
          filter="url(#lineGlow)"/>

    <!-- Barcode -->
    <g transform="translate(806,234)">
      <rect x="0"  y="0" width="3"  height="36" rx="1" fill="#3C3C43" fill-opacity="0.16"/>
      <rect x="6"  y="0" width="1.5" height="36" rx="1" fill="#3C3C43" fill-opacity="0.16"/>
      <rect x="11" y="0" width="5"  height="36" rx="1" fill="#3C3C43" fill-opacity="0.16"/>
      <rect x="19" y="0" width="1.5" height="36" rx="1" fill="#3C3C43" fill-opacity="0.16"/>
      <rect x="24" y="0" width="3"  height="36" rx="1" fill="#3C3C43" fill-opacity="0.16"/>
      <rect x="31" y="0" width="1.5" height="36" rx="1" fill="#3C3C43" fill-opacity="0.16"/>
      <rect x="36" y="0" width="5"  height="36" rx="1" fill="#3C3C43" fill-opacity="0.16"/>
      <rect x="44" y="0" width="1.5" height="36" rx="1" fill="#3C3C43" fill-opacity="0.16"/>
      <rect x="49" y="0" width="3"  height="36" rx="1" fill="#3C3C43" fill-opacity="0.16"/>
      <rect x="56" y="0" width="1.5" height="36" rx="1" fill="#3C3C43" fill-opacity="0.16"/>
      <rect x="61" y="0" width="5"  height="36" rx="1" fill="#3C3C43" fill-opacity="0.16"/>
    </g>

    <!-- Awaiting / manual -->
    <text x="850" y="362" font-family="Inter,system-ui,sans-serif" font-size="11"
          fill="#8E8E93" text-anchor="middle">Awaiting scan…</text>
    <text x="850" y="382" font-family="Inter,system-ui,sans-serif" font-size="11"
          font-weight="500" fill="#006B36" text-anchor="middle">Enter manually</text>

    <!-- CTA -->
    <rect x="742" y="396" width="216" height="46" rx="12" fill="url(#btnGrad)"/>
    <text x="850" y="424" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600"
          fill="white" text-anchor="middle">Confirm Collection</text>

    <!-- Home bar -->
    <rect x="815" y="454" width="70" height="3.5" rx="1.75" fill="#3C3C43" fill-opacity="0.2"/>

  </g>

  <!-- Dynamic island -->
  <rect x="813" y="2" width="68" height="20" rx="10" fill="#1C1C1E"/>

  <!-- Volume buttons -->
  <rect x="711" y="150" width="5" height="28" rx="3" fill="#2C2C2E"/>
  <rect x="711" y="190" width="5" height="28" rx="3" fill="#2C2C2E"/>

  <!-- Power button -->
  <rect x="984" y="168" width="5" height="44" rx="3" fill="#2C2C2E"/>

  <!-- Bottom glow -->
  <ellipse cx="850" cy="576" rx="110" ry="14" fill="#00C853" fill-opacity="0.1"/>
</svg>
