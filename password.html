<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>David Lee — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #fafafa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .gate {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .gate__logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1.75rem;
      color: #1a1a1a;
      text-decoration: none;
    }

    .gate__card {
      width: 100%;
      background: #fff;
      border: 1px solid #ebebeb;
      border-radius: 12px;
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .gate__heading {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      color: #1a1a1a;
      font-weight: 400;
      line-height: 1.2;
    }

    .gate__sub {
      font-size: 0.9rem;
      color: #888;
      line-height: 1.6;
      margin-top: -0.75rem;
    }

    .gate__field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .gate__label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #555;
    }

    .gate__input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .gate__input {
      width: 100%;
      padding: 0.8rem 3rem 0.8rem 1rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      color: #1a1a1a;
      background: #fafafa;
      transition: border-color 0.2s, background 0.2s;
      letter-spacing: 0.2em;
    }

    .gate__input:focus {
      outline: none;
      border-color: #1a1a1a;
      background: #fff;
    }

    .gate__input.error {
      border-color: #c0392b;
      background: #fff8f7;
    }

    .gate__toggle {
      position: absolute;
      right: 0.85rem;
      background: none;
      border: none;
      cursor: pointer;
      color: #aaa;
      padding: 0;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    .gate__toggle:hover { color: #555; }

    .gate__toggle svg {
      width: 18px;
      height: 18px;
      pointer-events: none;
    }

    .gate__error {
      font-size: 0.8rem;
      color: #c0392b;
      font-weight: 500;
      display: none;
    }

    .gate__error.visible { display: block; }

    .gate__btn {
      width: 100%;
      padding: 0.85rem;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .gate__btn:hover { background: #333; }
    .gate__btn:active { transform: scale(0.98); }

    .gate__footer {
      font-size: 0.8rem;
      color: #bbb;
      text-align: center;
    }
  </style>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5YFQMYE4YG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-5YFQMYE4YG');
  </script>
</head>
<body>

  <div class="gate">
    <a href="#" class="gate__logo">David Lee</a>

    <div class="gate__card">
      <h1 class="gate__heading">Protected Portfolio</h1>
      <p class="gate__sub">Enter the password to view this portfolio.</p>

      <form id="gate-form" novalidate>
        <div class="gate__field">
          <label class="gate__label" for="password">Password</label>
          <div class="gate__input-wrap">
            <input
              class="gate__input"
              type="password"
              id="password"
              autocomplete="current-password"
              placeholder="••••••••"
              autofocus
            />
            <button type="button" class="gate__toggle" id="toggle-visibility" aria-label="Show password">
              <!-- eye icon -->
              <svg id="icon-eye" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                <circle cx="12" cy="12" r="3" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <!-- eye-off icon (hidden by default) -->
              <svg id="icon-eye-off" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" style="display:none">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.97 9.97 0 012.19-3.568M6.53 6.53A9.97 9.97 0 0112 5c4.478 0 8.268 2.943 9.542 7a9.972 9.972 0 01-4.043 5.306M6.53 6.53L3 3m3.53 3.53l11 11M17.47 17.47L21 21" />
              </svg>
            </button>
          </div>
          <span class="gate__error" id="gate-error">Incorrect password. Please try again.</span>
        </div>

        <div style="margin-top: 1.25rem;">
          <button type="submit" class="gate__btn">Enter Portfolio</button>
        </div>
      </form>
    </div>

    <p class="gate__footer">&copy; 2024 David Lee</p>
  </div>

  <script>
    const CORRECT = '1234';
    const SESSION_KEY = 'dl_portfolio_auth';

    // Already authenticated — skip gate
    if (sessionStorage.getItem(SESSION_KEY) === 'true') {
      window.location.replace('warehouse-dashboard.html');
    }

    const form      = document.getElementById('gate-form');
    const input     = document.getElementById('password');
    const errorMsg  = document.getElementById('gate-error');
    const toggleBtn = document.getElementById('toggle-visibility');
    const iconEye    = document.getElementById('icon-eye');
    const iconEyeOff = document.getElementById('icon-eye-off');

    // Show/hide password toggle
    toggleBtn.addEventListener('click', () => {
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      iconEye.style.display    = isPassword ? 'none'  : 'block';
      iconEyeOff.style.display = isPassword ? 'block' : 'none';
    });

    // Clear error state on typing
    input.addEventListener('input', () => {
      input.classList.remove('error');
      errorMsg.classList.remove('visible');
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (input.value === CORRECT) {
        sessionStorage.setItem(SESSION_KEY, 'true');
        window.location.replace('warehouse-dashboard.html');
      } else {
        input.classList.add('error');
        errorMsg.classList.add('visible');
        input.value = '';
        input.focus();
      }
    });
  </script>
</body>
</html>
